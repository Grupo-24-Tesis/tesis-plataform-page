<h2>Caras únicas</h2>

<div class="grid">
  <div
    class="card"
    *ngFor="let item of grouped()"
    (click)="selectFace(item)"
  >
    <div class="face-image-container">
      <img
        class="face-image"
        [src]="item.appearances[0].frameUrl"
        [alt]="item.faceId"
      />
    </div>

    
    <p>{{ item.appearances.length }} apariciones</p>
  </div>
</div>

<section *ngIf="selected()" class="detail">
  <h3>Diferentes apariciones de la persona seleccionada </h3>

  <div class="appearances">
    <div
      class="appearance"
      *ngFor="let a of selected()!.appearances"
    >
      <div class="appearance-image-container">
        <img
          class="appearance-image"
          [src]="a.frameUrl"
          [alt]="selected()!.faceId"
        />
      </div>

      <p>{{ a.cameraId }} · {{ a.timestamp }}</p>
    </div>
  </div>
</section>
