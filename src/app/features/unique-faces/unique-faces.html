<section
  class="faces-page"
  [class.with-detail]="selected()"
>
  <main class="faces-content">
    <header class="page-header">
      <div>
        <span>DETECCIONES</span>
        <h1>Rostros detectados</h1>
      </div>

      <p>
        {{ faces().length }}
        {{ faces().length === 1 ? 'detección' : 'detecciones' }}
      </p>
    </header>

    <section class="filters">
      <div class="filter-field">
        <label for="startDate">Desde</label>
        <input
          id="startDate"
          type="date"
          [(ngModel)]="startDate"
        >
      </div>

      <div class="filter-field">
        <label for="endDate">Hasta</label>
        <input
          id="endDate"
          type="date"
          [(ngModel)]="endDate"
        >
      </div>

      <div class="filter-field">
        <label for="hasReports">Reportes</label>
        <select
          id="hasReports"
          [(ngModel)]="hasReports"
        >
          <option value="">Todos</option>
          <option value="true">Con reportes</option>
          <option value="false">Sin reportes</option>
        </select>
      </div>

      <div class="filter-field">
        <label for="suspect">Estado</label>
        <select
          id="suspect"
          [(ngModel)]="suspect"
        >
          <option value="">Todos</option>
          <option value="true">Marcadas</option>
          <option value="false">Sin marcar</option>
        </select>
      </div>

      <div class="filter-actions">
        <button
          type="button"
          class="btn btn-primary"
          (click)="applyFilters()"
        >
          FILTRAR
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="clearFilters()"
        >
          LIMPIAR
        </button>
      </div>
    </section>

    <p
      class="cameras-error"
      role="alert"
      *ngIf="camerasError()"
    >
      {{ camerasError() }}
    </p>

    <div class="grid">
      <button
        type="button"
        class="card"
        *ngFor="let face of faces()"
        [class.selected]="selected()?.faceId === face.faceId"
        (click)="selectFace(face)"
      >
        <div class="face-image-container">
          <img
            appImageFallback
            class="face-image"
            *ngIf="face.appearances[0]?.frameUrl as image; else facePlaceholder"
            [src]="image"
            [alt]="face.faceId"
          >

          <ng-template #facePlaceholder>
            <span class="image-placeholder" aria-hidden="true">♙</span>
          </ng-template>

          <span
            class="status-badge"
            [class.is-suspect]="face.suspect"
          >
            {{ face.suspect ? 'MARCADO' : 'SIN MARCAR' }}
          </span>
        </div>

        <div class="face-info">
          <div class="face-stats">
            <span>
              {{ face.reportCount }}
              {{ face.reportCount === 1 ? 'reporte' : 'reportes' }}
            </span>
          </div>
        </div>
      </button>

      <div
        *ngIf="loading()"
        class="empty-state"
        role="status"
      >
        <strong>Cargando...</strong>
      </div>

      <div
        *ngIf="!loading() && loadError()"
        class="empty-state"
        role="alert"
      >
        <strong>{{ loadError() }}</strong>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="loadFaces()"
        >
          Reintentar
        </button>
      </div>

      <div
        *ngIf="!loading() && !loadError() && faces().length === 0"
        class="empty-state"
      >
        <span aria-hidden="true">◎</span>
        <strong>No se encontraron detecciones</strong>
        <p>No hay resultados que coincidan con los filtros seleccionados.</p>
      </div>
    </div>
  </main>

  <aside
    class="detail"
    [class.closing]="detailClosing()"
    *ngIf="selectedAppearance() as appearance"
  >
    <header class="detail-header">
      <div>
        <span>DETALLE DE LA DETECCIÓN</span>
      </div>

      <button
        type="button"
        aria-label="Cerrar detalle"
        (click)="closeDetail()"
      >
        ×
      </button>
    </header>

    <app-detection-detail
      [appearance]="appearance"
      [cameras]="cameras()"
      (markChanged)="onMarkChanged($event)"
    />
  </aside>
</section>
