<svg
  class="chart"
  role="img"
  [attr.aria-label]="summary()"
  [attr.viewBox]="'0 0 ' + width + ' ' + height"
  preserveAspectRatio="xMidYMid meet"
>
  <line
    class="axis"
    x1="0"
    [attr.x2]="width"
    [attr.y1]="baseline"
    [attr.y2]="baseline"
  />

  @for (bar of bars(); track bar.hour) {
    <rect
      class="bar"
      [attr.x]="bar.x"
      [attr.y]="bar.y"
      [attr.width]="barWidth"
      [attr.height]="bar.height"
    >
      <title>{{ bar.title }}</title>
    </rect>

    @if (bar.label) {
      <text
        class="tick"
        text-anchor="middle"
        [attr.x]="bar.labelX"
        [attr.y]="labelY"
      >
        {{ bar.label }}
      </text>
    }
  }
</svg>
