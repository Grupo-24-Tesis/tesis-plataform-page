<h2>Reportes</h2>

<button
  class="new-report-btn"
  type="button"
  (click)="openModal()"
>
  + Nuevo reporte
</button>


<!-- ========================= -->
<!-- LISTA DE REPORTES -->
<!-- ========================= -->

<div class="list">

  <article
    *ngFor="let r of reports()"
    class="item"
  >

    <div class="report-info">

      <strong class="report-title">
        {{ r.title }}
      </strong>

      <p class="description">
        {{ r.description }}
      </p>

      <small class="priority">
        Prioridad:
        <span [class]="'priority-' + r.priority">
          {{ r.priority }}
        </span>
      </small>

    </div>


    <!-- ESTADO -->

    <div class="status-container">

      <label>
        Estado
      </label>

      <select
        [value]="r.status"
        (change)="updateStatus(r, $event)"
      >

        <option value="investigacion">
          Investigación
        </option>

        <option value="solucionado">
          Solucionado
        </option>

      </select>

    </div>

  </article>

</div>


<!-- ========================= -->
<!-- MODAL NUEVO REPORTE -->
<!-- ========================= -->

<div
  class="modal-overlay"
  *ngIf="showModal"
  (click)="closeModal()"
>

  <div
    class="modal"
    (click)="$event.stopPropagation()"
  >

    <!-- ENCABEZADO -->

    <div class="modal-header">

      <h3>
        Nuevo reporte
      </h3>

      <button
        type="button"
        class="close-button"
        (click)="closeModal()"
      >
        ×
      </button>

    </div>


    <!-- TÍTULO -->

    <div class="field">

      <label for="title">
        Título
      </label>

      <input
        id="title"
        type="text"
        [(ngModel)]="newReport.title"
        placeholder="Título del reporte"
      >

    </div>


    <!-- DESCRIPCIÓN -->

    <div class="field">

      <label for="description">
        Descripción
      </label>

      <textarea
        id="description"
        [(ngModel)]="newReport.description"
        placeholder="Descripción del reporte"
        rows="4"
      ></textarea>

    </div>


    <!-- PRIORIDAD -->

    <div class="field">

      <label for="priority">
        Prioridad
      </label>

      <select
        id="priority"
        [(ngModel)]="newReport.priority"
      >

        <option value="alta">
          Alta
        </option>

        <option value="media">
          Media
        </option>

        <option value="baja">
          Baja
        </option>

      </select>

    </div>


    <!-- ESTADO -->

    <div class="field">

      <label for="status">
        Estado inicial
      </label>

      <select
        id="status"
        [(ngModel)]="newReport.status"
      >

        <option value="investigacion">
          Investigación
        </option>

        <option value="solucionado">
          Solucionado
        </option>

      </select>

    </div>


    <!-- BOTONES -->

    <div class="modal-actions">

      <button
        type="button"
        class="cancel-button"
        (click)="closeModal()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="confirm-button"
        (click)="createReport()"
      >
        Crear reporte
      </button>

    </div>

  </div>

</div>
