<h2>Reportes</h2>
    <button>+ Nuevo reporte</button>
    <div class="list">
      <article *ngFor="let r of data.reports" class="item">
        <strong>{{ r.title }}</strong>
        <p>{{ r.description }}</p>
        <small>{{ r.id }} · {{ r.status }} · prioridad {{ r.priority }}</small>
      </article>
    </div>
